[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hades-mcp"
version = "0.1.0"
description = "Servidor MCP da biblioteca HADES: documentação, catálogo de componentes, gerador e validador de .hds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hades-mcp = "hades_mcp.server:main"

[tool.setuptools]
packages = ["hades_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
